name: Publish STIsim to PyPI (manual)

on: workflow_dispatch

jobs:
  build:
    name: Build STIsim
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: Install pypa/build
      run: python3 -m pip install build --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: Publish STIsim
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/stisim
    permissions:
      id-token: write

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release with installers
    needs:
    - publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Create release (or update its installers if it already exists)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        eval "$(python3 -c "exec(open('stisim/version.py').read()); print(f'VERSION={__version__} DATE={__versiondate__}')")"
        if gh release view "v$VERSION" >/dev/null 2>&1; then
          gh release upload "v$VERSION" install/install.bat install/install.sh --clobber
        else
          gh release create "v$VERSION" install/install.bat install/install.sh \
            --target "$GITHUB_SHA" --title "STIsim $VERSION" \
            --notes "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md#version-${VERSION//./}-$DATE) for the full release notes."
        fi
